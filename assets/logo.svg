<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64">
  <style>@font-face{font-family:LexendLogo;font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19c2aa"/>
      <stop offset=".55" stop-color="#0f9d8a"/>
      <stop offset="1" stop-color="#075f56"/>
    </linearGradient>
    <radialGradient id="glow" cx=".25" cy=".15" r=".7">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c6f4ea"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.4" flood-color="#04433d" flood-opacity=".35"/>
    </filter>
  </defs>
  

  <!-- round badge -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="31" fill="url(#glow)"/>
  <circle cx="32" cy="32" r="29.4" fill="none" stroke="#ffffff" stroke-opacity=".2"/>

  <!-- script (latin) M -->
  <path filter="url(#shadow)" fill="none" stroke="url(#ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
        d="M12.5 43.5C16 44.5 18.2 39.5 19.6 33C21 26.5 22.4 20.5 25.4 20.5C28.6 20.5 28.6 26.5 29 31.5
           C29.3 35.5 30.6 37 32 33.2C34.2 27 36.2 20.5 39.6 20.5C42.8 20.5 42.6 26 42.2 31.5
           C41.8 37.5 41.6 43.5 44.8 43.5C47.2 43.5 49.4 41.6 51.2 39"/>

  <text x="76" y="44" font-family="LexendLogo, Lexend, sans-serif" font-weight="700" font-size="31" letter-spacing="-0.6" fill="#0f9d8a">MedSecure-XR</text>
</svg>
